<section class="mainSection" style="background-image: url(./images/2037E%20A2%201920.jpg); background-position:top">
<!--    <h2>Team</h2>-->
    <section id="teamHolder">
        <span ng-click="move('right')">
            <svg width="100%" height="100%" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" version="1.1">
                <path d="M 800,-400
                         L 780,-400
                         L 200,500
                         L 780,1400
                         L 800,1400
                         L 220,500 z" fill="#818285" />
            </svg>
        </span>
        <span>
            <div class="stylistCard" ng-repeat="stylist in teamArray" style="left:{{leftPOS}}%" ng-click="selectStylist($index)">
                <img src="{{stylist.image}}" alt="Stylist Image">
                <p>{{stylist.name}}</p>
            </div>
        </span>
        <span ng-click="move('left')">
            <svg width="100%" height="100%" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" version="1.1">
                <path d="M 200,-400
                         L 220,-400
                         L 800,500
                         L 220,1400
                         L 200,1400
                         L 780,500 z" fill="#818285" />
            </svg>
        </span>
    </section>
    
    <section class="fadedBackdrop" ng-show="showInfo" ng-click="showInfo = false">
        <div id="selectedStylistCard">
            <div>
                <div>
                    <a href="https://www.instagram.com/{{selectedStylist.insta}}/" target="_blank" ng-if="selectedStylist.insta" >
                        <svg width="30px" height="30px" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" version="1.1">
                            <path id="instagram" d="M 100,200
                                Q 100,100 200,100
                                L 800,100
                                Q 900,100 900,200
                                L 900,800
                                Q 900,900 800,900
                                L 200,900
                                Q 100,900 100,800
                                
                                M 250,150
                                Q 150,150 150,250
                                L 150,800
                                Q 150,850 250,850
                                L 750,850
                                Q 850,850 850,750
                                L 850,250
                                Q 850,150 750,150 z
                                
                                M 500,300
                                A 100,100 0 0,1 500,700
                                A 100,100 0 0,1 500,300 z
                                
                                M 500,350
                                A 100,100 0 0,0 500,650
                                A 100,100 0 0,0 500,350 z
                                
                                M 725,225
                                A 50,50 0 0,1 725,325
                                A 50,50 0 0,1 725,225 z" fill="#f1f1f1" />
                        </svg>
                    </a>
                </div>
                <div>
                    <span>{{selectedStylist.name}}</span>
                </div>
            </div>
            <section>
                <span style="background-image:url({{selectedStylist.image}})"></span>
                <div><span>{{selectedStylist.name}}</span></div>
                <span>{{selectedStylist.bio}}<span id="stylistSpecialtiesPhone"><br>Specialties: {{selectedStylist.specialties}}</span></span>
            </section>
            <p id="stylistSpecialties" ng-if="selectedStylist.specialties">
                <spec>Specializes in: </spec> &nbsp;&nbsp; {{selectedStylist.specialties}}
            </p>
        </div>
    </section>
</section>
